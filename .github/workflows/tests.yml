name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: durable-agent benchmark
      - run: durable-agent dataset-validate
      - run: durable-agent e2e-run --mode deterministic --output results/ci-e2e
      - run: durable-agent fault-test --mode deterministic --point execute --window-seconds 2 --wait-timeout 8 --output results/ci-fault
